# Claude i issues og PR-er.
#
# Skriv @claude i et issue (tittel eller tekst), i en kommentar eller i en
# PR-review, så starter Claude Code her i Actions. Claude leser CLAUDE.md,
# gjør endringen på en egen gren og svarer i samme tråd med lenke for å lage
# en PR. Ingenting går til main uten at noen merger PR-en.
#
# Bare brukere med skrivetilgang til repoet kan starte Claude. Det sjekker
# actionen selv, og det er viktig fordi repoet er offentlig: fremmede kan
# opprette issues, men @claude fra dem gjør ingenting.
#
# Autentisering: legg inn én av disse under Settings → Secrets and variables
# → Actions → New repository secret. Den som mangler, blir tom og ignoreres.
#   ANTHROPIC_API_KEY        API-nøkkel fra console.anthropic.com, betales per bruk
#   CLAUDE_CODE_OAUTH_TOKEN  fra `claude setup-token`, bruker et Claude-abonnement
#
# Oppsettet følger examples/claude.yml i anthropics/claude-code-action.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lar Claude lese resultatet av andre workflows, f.eks. en feilende deploy
    steps:
      - name: Hent koden
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Nettleser til scripts/skjermbilde.py, så Claude kan se sidene den
      # endrer og sjekke layoutreglene, se «Se resultatet» i CLAUDE.md.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Playwright og Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Kjør Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Skjermbildescriptet kan kjøres uten egen sikkerhetsvurdering hver gang.
          claude_args: |
            --allowedTools "Bash(python scripts/skjermbilde.py:*),Bash(python3 scripts/skjermbilde.py:*)"

      # Bildene Claude tok, til nedlasting nederst på siden for kjøringen
      # (Actions → kjøringen → Artifacts → skjermbilder).
      - name: Last opp skjermbilder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skjermbilder
          path: /tmp/skjermbilder
          if-no-files-found: ignore
          retention-days: 14

      # Viser bildene rett i tråden, så de kan ses uten å laste ned zip.
      # Bildene lagres på grenen «skjermbilder», i én mappe per kjøring, og
      # vises i en kommentar og i Summary for kjøringen. Grenen er bare et
      # bildearkiv: den merges aldri, og main og siden påvirkes ikke.
      - name: Vis skjermbildene i tråden
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          NUMMER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          if ! ls /tmp/skjermbilder/*.png >/dev/null 2>&1; then
            echo "Claude tok ingen skjermbilder i denne kjøringen."
            exit 0
          fi

          arkiv=$(mktemp -d)
          cd "$arkiv"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth 1 origin skjermbilder 2>/dev/null; then
            git checkout -q -b skjermbilder FETCH_HEAD
          else
            git checkout -q --orphan skjermbilder
          fi
          mkdir -p "$RUN_ID"
          cp /tmp/skjermbilder/*.png "$RUN_ID"/
          git add "$RUN_ID"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Skjermbilder fra kjøring $RUN_ID"
          git push -q origin skjermbilder

          base="https://raw.githubusercontent.com/${REPO}/skjermbilder/${RUN_ID}"
          {
            echo "### 📸 Skjermbilder fra Claude"
            echo
            echo "Fra [kjøring ${RUN_ID}](https://github.com/${REPO}/actions/runs/${RUN_ID}). Klikk et bilde for full størrelse."
            for fil in "$RUN_ID"/*.png; do
              navn=$(basename "$fil")
              case "$navn" in *mobil*) bredde=260 ;; *) bredde=640 ;; esac
              echo
              echo "**${navn%.png}**"
              echo
              echo "<a href=\"${base}/${navn}\"><img src=\"${base}/${navn}\" width=\"${bredde}\"></a>"
            done
          } > galleri.md

          cat galleri.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$NUMMER" ]; then
            gh api "repos/${REPO}/issues/${NUMMER}/comments" -F body=@galleri.md --silent
          fi
