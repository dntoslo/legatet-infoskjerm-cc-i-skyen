name: Oppdater åpningstider og publiser

on:
  schedule:
    # Cron går i UTC og kjenner ikke sommertid. Fire linjer dekker
    # 06:30 og 12:00 norsk tid både sommer (UTC+2) og vinter (UTC+1).
    # De to ekstra kjøringene committer bare hvis data er endret.
    - cron: "30 4 * * *"
    - cron: "30 5 * * *"
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# To jobber, som i GitHubs egen mal for Pages. Med henting, opplasting og
# publisering i én jobb fant deploy-pages av og til ikke pakken som nettopp
# var lastet opp («No artifacts named github-pages», 19. november 2026).
# Når publiseringen er en egen jobb, er pakken ferdig registrert før den starter.
jobs:
  oppdater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hent åpningstider fra ut.no
        id: hent
        run: python scripts/hent_data.py

      # Committer bare når hyttedataene er endret, ikke bare tidsstempelet.
      # Den publiserte siden får uansett fersk data.json fra arbeidskopien.
      - name: Commit data.json hvis hyttedata er endret
        if: steps.hent.outputs.endret == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Oppdater åpningstider fra ut.no"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  publiser:
    needs: oppdater
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
